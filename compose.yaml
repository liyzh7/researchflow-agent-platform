name: researchflow-public-candidate

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    container_name: researchflow-public-candidate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: researchflow
      POSTGRES_PASSWORD: ${RESEARCHFLOW_DATABASE_PASSWORD:?set in the ignored .env file}
      POSTGRES_DB: researchflow
    ports:
      - "127.0.0.1:${RESEARCHFLOW_DATABASE_PORT:-55442}:5432"
    volumes:
      - researchflow-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchflow -d researchflow"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - researchflow-network

volumes:
  researchflow-postgres-data:
    name: researchflow-public-candidate-postgres-data

networks:
  researchflow-network:
    name: researchflow-public-candidate-network
