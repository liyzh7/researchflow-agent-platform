[project]
name = "researchflow"
version = "0.8.0rc1"
description = "Research Knowledge & Workflow Agent Platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.142.2",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "psycopg[binary]==3.3.6",
    "python-multipart==0.0.32",
    "pgvector==0.5.0",
    "sqlalchemy[asyncio]==2.1.5",
    "uvicorn==0.53.0",
    "langgraph==1.2.16",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg-pool==3.3.3",
    "pwdlib[argon2]==0.3.1",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
]

[project.scripts]
researchflow = "researchflow.cli:main"

[dependency-groups]
ai = ["sentence-transformers==6.1.0"]
dev = [
    "httpx2==2.13.0",
    "pytest==9.1.0",
    "ruff==0.17.0",
]

[tool.uv]
default-groups = ["dev", "ai"]

[build-system]
requires = ["uv_build==0.12.21"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires the dedicated ResearchFlow PostgreSQL test database",
    "real_embedding: loads the pinned local embedding model",
    "real_llm: calls an explicitly approved loopback-only local LLM service",
    "real_reranker: loads the pinned local CrossEncoder reranker",
    "agent_postgres: requires dedicated researchflow_agent_test and PostgreSQL checkpoints",
    "security_postgres: real identity, ownership, audit and telemetry in researchflow_security_test",
    "local_docker: controlled local PostgreSQL restart or backup (excluded from cloud CI)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".uv-cache", ".venv"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
